# pyproject.toml — Project tooling configuration
# This file configures ruff (linter), pytest (tests), and mypy (type checker)
# All tools read from here instead of having separate config files

[tool.ruff]
# Which Python version to target
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Rules to enforce:
#   Only rules that catch REAL bugs, so CI fails on broken code, not on style:
#   E9  = syntax / IO errors
#   F63 = invalid comparisons / assertions
#   F7  = misplaced break/continue/return/yield
#   F82 = undefined names
# Style rules (W whitespace, I import order, UP modern syntax, F401 unused
# imports) are intentionally off for now: some "unused" imports are deliberate
# (e.g. alembic/env.py registers models). Re-enable gradually with `ruff --fix`.
select = ["E9", "F63", "F7", "F82"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["core", "api", "models", "schemas", "services", "tasks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# -v = verbose output, show each test name
# -s = don't capture stdout (useful for debugging)
addopts = "-v -s"

[tool.mypy]
python_version = "3.11"
strict = false         # Start lenient, tighten as project matures
ignore_missing_imports = true
