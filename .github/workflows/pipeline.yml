name: Belaku Kannu Data Pipeline
# Hourly schedule DISABLED: the scripts below are in subfolders (extractors/,
# transformers/, loaders/), the pipeline needs generated input files that are
# not in the repo, and it needs POSTGRES_* repository secrets. Fix those, then
# re-enable by restoring:
#   schedule:
#     - cron: '0 * * * *'
on:
  workflow_dispatch: # Manual trigger from the GitHub UI only

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          cd data-pipeline
          pip install -r requirements.txt

      - name: Fetch Live Weather
        run: |
          cd data-pipeline
          python fetch_weather.py

      - name: Run Digital Twin Engine
        run: |
          cd data-pipeline
          python digital_twin_engine.py

      - name: Sync to Supabase Database
        env:
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT: 5432
        run: |
          cd data-pipeline
          python supabase_sync.py
